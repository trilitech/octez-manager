name: Coverage Report

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger for debugging

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test-coverage:
    name: Build & Unit Tests (Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/${{ github.repository }}-ci-debian:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --tty  # Allocate a pseudo-TTY for UI tests
    env:
      OPAMYES: "true"
      OPAMROOT: /root/.opam
      MIAOU_GIT_URL: "https://github.com/trilitech/miaou.git"
      PPX_FORBID_GIT_URL: "https://github.com/atacama-dev/ppx_forbid.git"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for coverage comparison

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache opam packages
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: /root/.opam
          key: opam-debian-miaou-${{ hashFiles('.github/miaou-version') }}

      - name: Ensure opam is initialized
        id: opam-init
        run: |
          if opam switch list 2>&1 | grep -q "5.3.0"; then
            echo "Opam switch 5.3.0 exists, using it..."
            eval $(opam env)
          else
            echo "Initializing opam and creating switch 5.3.0..."
            opam init --disable-sandboxing --bare -y || true
            opam switch create 5.3.0 ocaml.5.3.0 -y
            eval $(opam env)
          fi
          # Verify the switch is functional — a cache hit can restore /root/.opam
          # but the switch may be invalid, causing opam to recreate a bare switch
          # without dune or project dependencies.
          eval $(opam env)
          if command -v dune > /dev/null 2>&1; then
            echo "switch-valid=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: opam switch exists but dune is not installed."
            echo "Will reinstall dependencies."
            echo "switch-valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Pin miaou and ppx_forbid packages
        if: steps.cache-opam.outputs.cache-hit != 'true' || steps.opam-init.outputs.switch-valid != 'true'
        run: |
          eval $(opam env)
          echo "Pinning ppx_forbid..."
          opam pin add ppx_forbid "$PPX_FORBID_GIT_URL" --no-action
          echo "Pinning miaou packages..."
          opam pin add miaou-core "$MIAOU_GIT_URL" --no-action
          opam pin add miaou-driver-term "$MIAOU_GIT_URL" --no-action
          opam pin add miaou-driver-matrix "$MIAOU_GIT_URL" --no-action
          opam pin add miaou-driver-web "$MIAOU_GIT_URL" --no-action
          opam pin add miaou-runner "$MIAOU_GIT_URL" --no-action
          opam install ppx_forbid miaou-core miaou-driver-term miaou-driver-matrix miaou-driver-web miaou-runner eio_posix --jobs=4

      - name: Install project dependencies
        if: steps.cache-opam.outputs.cache-hit != 'true' || steps.opam-init.outputs.switch-valid != 'true'
        run: |
          eval $(opam env)
          opam install . --deps-only --with-test --jobs=4

      - name: Build instrumented static binary
        run: |
          eval $(opam env)
          echo '(-ccopt -static)' > static_flags.sexp
          dune build --instrument-with bisect_ppx --release
          cp _build/default/src/main.exe octez-manager-instrumented
          chmod +x octez-manager-instrumented

          # Build golden path test binary for integration tests
          dune build --instrument-with bisect_ppx test/test_golden_path_tui_v2.exe
          cp _build/default/test/test_golden_path_tui_v2.exe test_golden_path_tui_v2
          chmod +x test_golden_path_tui_v2

          # Verify they're static
          ldd octez-manager-instrumented 2>&1 | head -10 || echo "Static binary confirmed"
          ldd test_golden_path_tui_v2 2>&1 | head -10 || echo "Test binary confirmed"

      - name: Run unit tests with coverage
        run: |
          mkdir -p /dev/shm/coverage
          export BISECT_FILE=/dev/shm/coverage/bisect-unit

          # Set terminal environment for headless TUI tests
          export TERM=xterm-256color
          export TERMINFO=/usr/share/terminfo

          eval $(opam env)

          # Reset static_flags before running tests (tests need dynamic linking)
          git checkout -- static_flags.sexp

          # Run tests with instrumentation (5 min timeout as safety net)
          echo "Starting tests at $(date -u '+%H:%M:%S')"
          timeout 300 dune runtest --instrument-with bisect_ppx --force || {
            exit_code=$?
            if [ $exit_code -eq 124 ]; then
              echo "ERROR: Tests timed out after 5 minutes!"
              exit 1
            else
              echo "Tests failed with exit code $exit_code"
              exit $exit_code
            fi
          }
          echo "Completed at $(date -u '+%H:%M:%S')"

          # Copy coverage files to artifact location
          mkdir -p _coverage
          cp -v /dev/shm/coverage/* _coverage/ || echo "Warning: No coverage files generated"
          ls -lah _coverage/
        continue-on-error: false

      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: _coverage/
          retention-days: 1

      - name: Upload instrumented binary
        uses: actions/upload-artifact@v4
        with:
          name: octez-manager-coverage
          path: |
            octez-manager-instrumented
            test_golden_path_tui_v2
          retention-days: 1

  integration-coverage:
    name: Integration Tests Coverage (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [build-and-test-coverage]
    # Only run on main branch pushes to maintain coverage baseline
    # For PRs, fast non-instrumented tests run in ci.yml instead
    if: github.event_name == 'push'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download instrumented binary
        uses: actions/download-artifact@v4
        with:
          name: octez-manager-coverage
          path: .

      - name: Copy binary to test location
        run: |
          mkdir -p test/integration/cli-tester
          cp octez-manager-instrumented test/integration/cli-tester/octez-manager
          cp test_golden_path_tui_v2 test/integration/cli-tester/test_golden_path_tui_v2
          chmod +x test/integration/cli-tester/octez-manager test/integration/cli-tester/test_golden_path_tui_v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('test/integration/**/Dockerfile*') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Build coverage test containers with cache
        working-directory: test/integration
        env:
          DOCKER_BUILDKIT: 1
        run: |
          # Build sandbox with cache
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -t test-integration-sandbox:latest \
            -f sandbox/Dockerfile \
            .

          # Build cli-tester with cache (coverage variant)
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -t test-integration-cli-tester:latest \
            -f cli-tester/Dockerfile.coverage \
            .

      - name: Start sandbox
        working-directory: test/integration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.coverage.yml up -d sandbox
          timeout 300 bash -c 'until docker compose exec -T sandbox curl -sf http://localhost:8080/health 2>/dev/null; do echo "Waiting for sandbox..."; sleep 10; done'

      - name: Start cli-tester with coverage
        working-directory: test/integration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.coverage.yml up -d cli-tester
          echo "Waiting for systemd..."
          for i in {1..30}; do
            if docker compose exec -T cli-tester systemctl is-system-running 2>/dev/null; then
              echo "Systemd is ready"
              break
            fi
            echo "Attempt $i: systemd not ready yet..."
            sleep 2
          done
          docker compose ps

      - name: Run integration tests with coverage (Shard ${{ matrix.shard }})
        working-directory: test/integration
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: 5
          PARALLEL_JOBS: 3
        run: |
          docker compose -f docker-compose.yml -f docker-compose.coverage.yml exec -T -e SHARD -e TOTAL_SHARDS -e PARALLEL_JOBS cli-tester /run-tests.sh

      - name: Extract coverage data from container
        working-directory: test/integration
        run: |
          mkdir -p ../../_coverage-integration
          docker compose -f docker-compose.yml -f docker-compose.coverage.yml cp cli-tester:/coverage/. ../../_coverage-integration/ || true
          ls -la ../../_coverage-integration/

      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-shard-${{ matrix.shard }}
          path: _coverage-integration/
          retention-days: 1

      - name: Cleanup containers
        if: always()
        working-directory: test/integration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.coverage.yml down -v || true

      - name: Move Docker cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true

  report:
    name: Generate and Post Coverage Report
    runs-on: ubuntu-latest
    needs: [build-and-test-coverage, integration-coverage]
    if: always() && needs.build-and-test-coverage.result == 'success'
    container:
      image: ghcr.io/${{ github.repository }}-ci-debian:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      OPAMYES: "true"
      OPAMROOT: /root/.opam

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          opam install bisect_ppx
          # Install jq for JSON parsing
          apt-get update && apt-get install -y jq

      - name: Download unit coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: _coverage/

      - name: Download integration coverage data (all shards)
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-integration-shard-*
          path: _coverage/
          merge-multiple: true
        continue-on-error: true

      - name: List all coverage files
        run: |
          echo "Coverage files found:"
          find _coverage -name "*.coverage" -ls || echo "No coverage files found"

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          
          echo "Generating coverage report..."
          echo "Total source files: $(find src -name "*.ml" -not -name "*_tests.ml" | wc -l)"
          
          # Generate summary
          echo "## Coverage Report" > coverage-summary.md
          echo "" >> coverage-summary.md
          
          echo "Running bisect-ppx-report summary..."
          # TODO: Exclude test files from coverage (requires bisect_ppx changes or post-processing)
          bisect-ppx-report summary \
            --coverage-path _coverage > coverage-summary.txt 2>&1 || true
          
          echo "=== Coverage summary output ==="
          cat coverage-summary.txt
          echo "=== End coverage summary ==="
          
          cat coverage-summary.txt >> coverage-summary.md
          
          # Generate HTML report
          bisect-ppx-report html \
            --coverage-path _coverage \
            --title "Octez Manager Coverage" \
            -o coverage-report || echo "HTML generation failed"
          
          # Generate per-file summary and parse into JSON for comparison
          echo "" >> coverage-summary.md
          echo "### Coverage by File" >> coverage-summary.md
          echo "" >> coverage-summary.md
          echo '```' >> coverage-summary.md
          bisect-ppx-report summary \
            --coverage-path _coverage \
            --per-file > per-file-coverage.txt 2>&1 || true
          
          # Filter out test files from per-file coverage
          grep -v '^[[:space:]]*[0-9.]*[[:space:]]*%.*test/' per-file-coverage.txt > per-file-coverage-filtered.txt || cp per-file-coverage.txt per-file-coverage-filtered.txt
          cat per-file-coverage-filtered.txt >> coverage-summary.md
          
          # Parse per-file coverage into JSON for easy comparison (excluding test files)
          echo "{" > coverage-data.json
          grep -E '^ *[0-9]+\.[0-9]+ %' per-file-coverage.txt | grep -v 'test/' | while IFS= read -r line; do
            pct=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $NF}')
            echo "  \"$file\": $pct," >> coverage-data.json
          done
          # Remove trailing comma and close JSON
          sed -i '$ s/,$//' coverage-data.json
          echo "}" >> coverage-data.json
          
          # Append files with no coverage (not instrumented or not executed)
          echo "" >> coverage-summary.md
          echo "### Files Not Covered (0%)" >> coverage-summary.md
          echo "" >> coverage-summary.md
          
          # Get list of all source files
          find src -name "*.ml" -not -name "*_tests.ml" | sort > /tmp/all_files.txt
          
          # Get list of files in coverage report
          grep -oE "src/[^[:space:]]+\.ml" coverage-summary.md | sort -u > /tmp/covered_files.txt || touch /tmp/covered_files.txt
          
          # Find files missing from coverage
          MISSING_COUNT=$(comm -23 /tmp/all_files.txt /tmp/covered_files.txt | wc -l)
          
          if [ "$MISSING_COUNT" -gt 0 ]; then
            echo "$MISSING_COUNT files with no coverage data:" >> coverage-summary.md
            comm -23 /tmp/all_files.txt /tmp/covered_files.txt | while read file; do
              echo "  0.00 %      0/0       $file" >> coverage-summary.md
            done
          else
            echo "All source files have coverage data!" >> coverage-summary.md
          fi
          
          echo '```' >> coverage-summary.md
          
          # Extract overall percentage from format: "Coverage: 6688/11735 (56.99%)"
          echo "Extracting coverage percentage..."
          if grep -q 'Coverage:' coverage-summary.txt; then
            # Extract percentage from parentheses: (XX.XX%)
            COVERAGE_PCT=$(grep 'Coverage:' coverage-summary.txt | sed 's/.*(\([0-9.]*\)%).*/\1/' | head -1)
          else
            # Fallback: look for any percentage pattern
            COVERAGE_PCT=$(grep -o '[0-9]\+\.[0-9]\+%' coverage-summary.txt | head -1 | tr -d '%')
          fi
          
          # If still empty, default to 0
          if [ -z "$COVERAGE_PCT" ]; then
            COVERAGE_PCT="0"
          fi
          
          echo "COVERAGE_PCT=$COVERAGE_PCT" >> $GITHUB_ENV
          echo "Overall coverage: $COVERAGE_PCT%"
          
          # Save coverage data for base branch comparison
          echo "{\"overall\": $COVERAGE_PCT, \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"commit\": \"$GITHUB_SHA\"}" > coverage-baseline.json
          cat coverage-data.json | jq ". + {\"__meta\": $(cat coverage-baseline.json)}" > coverage-full.json || cp coverage-baseline.json coverage-full.json

      - name: Upload coverage baseline (for main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: |
            coverage-full.json
            coverage-data.json
          retention-days: 90

      - name: Update coverage badge (for main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: octez-manager-coverage.json
          label: coverage
          message: "${{ env.COVERAGE_PCT }}%"
          valColorRange: ${{ env.COVERAGE_PCT }}
          minColorRange: 0
          maxColorRange: 100

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Coverage check
        run: |
          COVERAGE_PCT=$(grep -oP 'Coverage: \K[0-9.]+' coverage-summary.txt || echo "0")
          echo "Coverage: $COVERAGE_PCT%"
          
          # Fail if coverage drops below threshold (optional)
          # THRESHOLD=50
          # if (( $(echo "$COVERAGE_PCT < $THRESHOLD" | bc -l) )); then
          #   echo "ERROR: Coverage $COVERAGE_PCT% is below threshold $THRESHOLD%"
          #   exit 1
          # fi
